openapi: 3.0.3
info:
  title: Library Service
  description: Read-only access to the team library's fixed in-memory book catalogue.
  version: 0.1.0
servers:
  - url: /
paths:
  /books:
    get:
      operationId: searchBooks
      summary: Search the catalogue, optionally filtered by genre and/or author
      security:
        - oauth2: [books:read]
      parameters:
        - name: genre
          in: query
          schema:
            type: string
          description: Filter to books of this genre
        - name: author
          in: query
          schema:
            type: string
          description: Filter to books by this author
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count:
                    type: integer
                    description: total matching items
                  next:
                    type: string
                    nullable: true
                    description: relative URI of the next page
                  previous:
                    type: string
                    nullable: true
                    description: relative URI of the previous page
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/{id}:
    get:
      operationId: getBook
      summary: Read one book's detail and current availability
      security:
        - oauth2: [books:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: No book with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            books:read: Search the catalogue and read any book's detail and availability
  schemas:
    Book:
      type: object
      required: [id, title, author, genre, year, available]
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        year:
          type: integer
        available:
          type: boolean
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
security:
  - oauth2: []
